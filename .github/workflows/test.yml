name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,webrtc]"
      # no provider key: whole calls run against tests/fake_provider.py, tools against tests/fixture_mcp.py
      - run: python -m pytest -q
      # Pipecat's core install requires two LGPL packages the harness does not use (README, License).
      # The same suite with them taken out: the install the README describes is the one that is tested.
      - run: pip uninstall -y soxr num2words docopt
      - run: |
          python - <<'PY'
          import importlib.util
          left = [m for m in ("soxr", "num2words", "docopt") if importlib.util.find_spec(m)]
          assert not left, left
          PY
      - run: python -m pytest -q
