name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,webrtc]"
      # no provider key: whole calls run against tests/fake_provider.py, tools against tests/fixture_mcp.py
      - run: python -m pytest -q
