[project]
name = "realtime-harness"
version = "0.1.0.dev0"
description = "A harness for realtime speech models: the configuration, every tool call, the record and the meter, served over UHP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13.1",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",
    "pipecat-ai[websocket]==1.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rth = "realtime_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["realtime_harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
